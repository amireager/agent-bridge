<!doctype html>
<html lang="fa" data-theme="openwebui-dark" data-font="large">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="اتاق فرمان محلی برای مدل‌ها، مترجم و عامل‌های ترمینالی Agent Bridge" />
  <title>Agent Bridge · اتاق فرمان</title>
  <link rel="stylesheet" href="/static/styles/base.css" />
  <link rel="stylesheet" href="/static/styles/components.css" />
  <link rel="stylesheet" href="/static/styles/markdown.css" />
  <link rel="stylesheet" href="/static/pages/chat/chat.css" />
  <link rel="stylesheet" href="/static/pages/home/home.css" />
  <link rel="stylesheet" href="/static/pages/about/about.css" />
</head>
<body>
  <div id="shellRoot" class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="sb-brand">
        <button class="sb-brand-home" type="button" onclick="ABApp.navigate('home')" title="رفتن به داشبورد">
          <span class="brand-mark" aria-hidden="true">AB</span>
          <span class="hide-collapsed" style="display:flex;align-items:center;gap:8px;">
            <span>Agent Bridge</span>
            <span class="sb-brand-tag">CONTROL</span>
          </span>
        </button>
        <button class="btn ghost" onclick="ABApp.toggleSidebarCollapse()" title="جمع/باز کردن سایدبار">≡</button>
      </div>

      <nav id="sbTree" class="sb-tree"></nav>
      <footer id="sbFoot" class="sb-status-foot hide-collapsed"></footer>
    </aside>
    <div id="sidebarResizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" aria-valuemin="150" aria-valuemax="560" aria-label="تغییر اندازهٔ نوار کناری" tabindex="0" title="برای تغییر عرض بکش یا از کلیدهای جهت‌دار استفاده کن"></div>

    <main class="workspace">
      <header id="hudBar" class="hud-bar"></header>
      <div id="pageHost" class="page-host is-chat"></div>
    </main>
  </div>

  <script src="/static/core/utils.js"></script>
  <script src="/static/core/markdown.js"></script>
  <script src="/static/pages/chat/chat.js"></script>
  <script src="/static/pages/home/home.js"></script>
  <script src="/static/pages/about/about.js"></script>
  <script src="/static/pages/usage/usage.js"></script>
  <script src="/static/pages/settings/settings.js"></script>
  <script src="/static/core/state.js"></script>
  <script>window.ABApp.boot();</script>
</body>
</html>
